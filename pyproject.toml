[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dm100-3d"
version = "0.1.0"
description = "DM100 3D: 6DOF MuJoCo orbital launch, reusable RTLS GNC, and Unreal Engine 5.4 cinematic pipeline"
readme = "README.md"
requires-python = ">=3.10,<3.14"
keywords = ["rocket", "mujoco", "6dof", "rtls", "gfold", "socp", "mekf", "unreal-engine"]
dependencies = [
    "numpy>=1.24,<3",
    "scipy>=1.10,<2",
    "mujoco>=3.2,<4",
    "clarabel>=0.9,<1",
    "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
assets = ["trimesh>=4.4,<5"]
kaggle = ["kaggle>=1.6,<2", "six>=1.16"]
dev = [
    "pytest>=8,<9",
    "ruff>=0.6,<1",
    "trimesh>=4.4,<5",
    "kaggle>=1.6,<2",
    "six>=1.16",
]

[project.urls]
Repository = "https://github.com/Dongmyung378/DM100-3D-Rocket-Recovery"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["slow: full closed-loop 6DOF flight tests (offloaded to Kaggle CPU shards)"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]
